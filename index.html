<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>綠園生活標籤列印系統</title>
    <style>
        :root {
            /* 定義標籤尺寸 */
            --label-width: 87.5mm;
            --label-height: 60.7mm;
            --sidebar-width: 350px;
            
            /* 左右留邊統一為 12mm */
            --content-padding-x: 12mm;
            --max-content-width: calc(var(--label-width) - (var(--content-padding-x) * 2)); 
        }

        body {
            font-family: "Microsoft JhengHei", "PingFang TC", Arial, sans-serif;
            display: flex;
            margin: 0;
            background-color: #e9ecef;
            color: #333;
        }

        /* 左側控制面板 */
        #sidebar {
            width: var(--sidebar-width);
            padding: 25px;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
            flex-shrink: 0;
            z-index: 10;
        }

        h2 {
            margin-top: 0;
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
            font-size: 1.5rem;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .category-box {
            background: #eef6fc;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #b6d4fe;
            margin-bottom: 20px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            cursor: pointer;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 4px;
            border: 1px solid #ced4da;
        }

        .checkbox-group input {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 9px 10px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: background-color 0.3s, border-color 0.3s;
        }

        .weight-custom-row {
            display: flex;
            gap: 6px;
        }

        .weight-custom-row input {
            width: 60%;
        }

        .weight-custom-row select {
            width: 40%;
        }

        .weight-hint {
            display: block;
            font-size: 0.82rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .is-modified {
            background-color: #fcb6b6 !important;
            border-color: #ffb3b3 !important;
        }

        .date-display-text {
            display: block;
            margin-top: 5px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.05rem;
            padding: 3px 0;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 4px;
            transition: background 0.3s;
            margin-top: 10px;
        }

        button:hover {
            background: #2980b9;
        }

        /* 右側預覽區 */
        #preview-area {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px;
            overflow: auto;
            background-color: #d1d8e0;
        }

        #label-container {
            transform: scale(1.5);
            transform-origin: center center;
            display: inline-block;
        }

        .label-page {
            width: var(--label-width);
            height: var(--label-height);
            background: white;
            border: 1px dashed #adb5bd;
            position: relative;
            box-shadow: 0 15px 45px rgba(0,0,0,0.15);
            overflow: hidden;
            flex-shrink: 0;
            box-sizing: border-box;
        }

        /* ================= 康達勝通模式樣式 (完全保留原位置) ================= */
        .field {
            position: absolute;
            font-size: 11pt;
            color: #000;
            line-height: 1.2;
            white-space: nowrap;
        }

        .content-aligned {
            left: var(--content-padding-x);
            width: var(--max-content-width);
        }

        #displayNameContainer {
            top: 30mm;
            height: 15mm;
            display: flex;
            align-items: center;
            justify-content: center; 
            text-align: center;      
            overflow: hidden;
        }

        #displayName {
            font-weight: bold;
            font-size: 24pt;
            white-space: nowrap;
            display: inline-block;
            line-height: 1;
        }

        #displayCount {
            font-weight: bold;
            font-size: 13pt;
            left: calc(var(--content-padding-x) + 16mm);
        }

        #solarDay {
            font-size: 18pt;
            font-weight: bold;
            letter-spacing: 1px;
            border: 2px solid #000;
            padding: 1mm;
            width: 14mm;
            height: 8mm;
            box-sizing: border-box;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #miaTag {
            font-size: 16pt;
            font-weight: bold;
            display: none; 
            align-items: center;
            height: 8mm;
        }

        #giftBox {
            font-size: 16pt;
            font-weight: bold;
            border: 2px solid #000;
            padding: 0 3mm;
            height: 8mm;
            box-sizing: border-box;
            display: none; 
            justify-content: center;
            align-items: center;
        }

        #storeBox {
            font-size: 14pt;
            font-weight: bold;
            border: 2px solid #000;
            padding: 0 3mm;
            height: 8mm;
            box-sizing: border-box;
            display: none; 
            justify-content: center;
            align-items: center;
            max-width: 35mm;
            white-space: nowrap;
            overflow: hidden;
        }

        /* ================= 農場模式樣式 (左右留白 12mm，品項基準 36pt，重量 22pt) ================= */
        #farm-layout {
            width: 100%;
            height: 100%;
            padding: 4.5mm var(--content-padding-x) 4mm var(--content-padding-x);
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            color: #000;
        }

        .farm-date {
            font-size: 36pt;
            font-weight: bold;
            text-align: center;
            line-height: 1.05;
            letter-spacing: 1px;
        }

        .farm-item-container {
            width: 100%;
            height: 16mm;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #farmDisplayItem {
            font-size: 36pt;
            font-weight: bold;
            white-space: nowrap;
            line-height: 1.15;
        }

        .farm-bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            width: 100%;
            gap: 6mm;
            padding-bottom: 1.5mm;
        }

        #farmDisplayWeight {
            font-size: 22pt;
            font-weight: bold;
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1.3;
        }

        #farmDisplayName {
            font-size: 17pt;
            font-weight: bold;
            white-space: nowrap;
            text-align: right;
            line-height: 1.3;
            margin-left: auto;
        }

        /* ================= 自用模式樣式 (左右留白 12mm，日期 + 中間大字) ================= */
        #self-layout {
            width: 100%;
            height: 100%;
            padding: 6mm var(--content-padding-x) 8mm var(--content-padding-x);
            box-sizing: border-box;
            display: none;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            color: #000;
        }

        .self-date {
            font-size: 36pt;
            font-weight: bold;
            text-align: center;
            line-height: 1.05;
            letter-spacing: 1px;
        }

        .self-item-container {
            width: 100%;
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #selfDisplayItem {
            font-size: 36pt;
            font-weight: bold;
            white-space: nowrap;
            line-height: 1.15;
        }

        @media print {
            @page {
                size: 87.5mm 60.7mm;
                margin: 0;
            }
            body {
                background: none;
            }
            #sidebar {
                display: none;
            }
            #preview-area {
                padding: 0;
                margin: 0;
                display: block;
                background: none;
            }
            #label-container {
                transform: none;
                display: block;
            }
            .label-page {
                border: none;
                box-shadow: none;
                margin: 0;
                page-break-after: always;
            }
        }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>標籤列印系統</h2>

    <!-- 頂層分類選擇 -->
    <div class="category-box">
        <label style="color: #0d47a1;">1. 選擇系統分類</label>
        <select id="mainCategorySelect" onchange="switchMainCategory()">
            <option value="kangda">康達勝通</option>
            <option value="farm">農場</option>
            <option value="self">自用</option>
        </select>
    </div>

    <!-- ================= 康達勝通控制區 ================= -->
    <div id="kangdaControls">
        <div class="input-group">
            <label>2. 選擇倉別</label>
            <select id="warehouseSelect" onchange="updateItemOptions()">
                <option value="dayuan">大園倉</option>
                <option value="xiluo">西螺倉</option>
                <option value="mia">MIA 倉</option>
                <option value="others">其他倉</option>
            </select>
        </div>
        
        <div class="input-group">
            <label>3. 快速選擇品項</label>
            <select id="itemSelect" onchange="syncFromSelect()">
            </select>
        </div>

        <div class="input-group">
            <label>單品名稱</label>
            <input type="text" id="inputName" placeholder="請輸入單品名稱" oninput="updateContent()">
        </div>

        <div class="input-group">
            <label id="labelCount">箱入數</label>
            <input type="number" id="inputCount" placeholder="請輸入數量" oninput="updateContent()">
        </div>

        <div class="input-group">
            <label>選擇日期 (計算太陽日)</label>
            <input type="date" id="arrivalDate" onchange="updateContent()">
            <span id="panelDateHint" class="date-display-text"></span>
        </div>

        <div class="checkbox-group" onclick="toggleGift(event)">
            <input type="checkbox" id="inputIsGift" onchange="updateContent()">
            <label style="margin-bottom: 0; cursor: pointer;">標記為贈品</label>
        </div>

        <div class="input-group">
            <label>自訂店家名 (選填)</label>
            <input type="text" id="inputStoreName" placeholder="例如：某某分店..." oninput="updateContent()">
        </div>
    </div>

    <!-- ================= 農場控制區 ================= -->
    <div id="farmControls" style="display: none;">
        <div class="input-group">
            <label>2. 選擇農場 (產品：農民)</label>
            <select id="farmSelect" onchange="updateFarmOptions()">
            </select>
        </div>

        <div class="input-group">
            <label>農場名稱 (列印顯示，可手動微調)</label>
            <input type="text" id="inputFarmName" placeholder="請輸入農場名稱" oninput="updateContent()">
        </div>

        <div class="input-group">
            <label>3. 快速選擇品項</label>
            <select id="farmItemSelect" onchange="syncFarmItem()">
            </select>
        </div>

        <div class="input-group">
            <label>品項名稱</label>
            <input type="text" id="inputFarmItem" placeholder="請輸入品項名稱" oninput="updateContent()">
        </div>

        <div class="input-group" id="farmWeightGroup">
            <label>重量 / 數量 (已自動帶入，亦可直接修改)</label>
            <div class="weight-custom-row">
                <input type="text" id="inputFarmWeightVal" value="20" placeholder="數量 (留白則不顯示)" oninput="updateContent()">
                <select id="inputFarmWeightUnit" onchange="updateContent()">
                    <option value="台斤">台斤</option>
                    <option value="kg">kg</option>
                    <option value="把">把</option>
                    <option value="">(無單位)</option>
                </select>
            </div>
            <span class="weight-hint">可直接修改數字或單位，留白則標籤不顯示重量</span>
        </div>

        <div class="input-group">
            <label>選擇日期 (預設瀏覽器今天)</label>
            <input type="date" id="farmDate" onchange="updateContent()">
            <span id="farmDateHint" class="date-display-text"></span>
        </div>
    </div>

    <!-- ================= 自用控制區 ================= -->
    <div id="selfControls" style="display: none;">
        <div class="input-group">
            <label>2. 快速選擇項目</label>
            <select id="selfItemSelect" onchange="syncSelfItem()">
            </select>
        </div>

        <div class="input-group">
            <label>顯示文字 (可手動修改)</label>
            <input type="text" id="inputSelfItem" placeholder="請輸入顯示文字" oninput="updateContent()">
        </div>

        <div class="input-group">
            <label>選擇日期 (預設瀏覽器今天)</label>
            <input type="date" id="selfDate" onchange="updateContent()">
            <span id="selfDateHint" class="date-display-text"></span>
        </div>
    </div>

    <button onclick="window.print()">執行列印</button>
</div>

<div id="preview-area">
    <div id="label-container">
        <div class="label-page" id="label">
            
            <!-- ================= 康達勝通預覽版面 ================= -->
            <div id="kangda-layout">
                <!-- 固定欄位標頭 -->
                <div class="field content-aligned" style="top: 3.3mm;">到店日: </div>
                <div class="field content-aligned" style="top: 8.7mm;">供應商編號: 22H907</div>
                <div class="field content-aligned" style="top: 14mm;">供應商名稱: 綠園生活有限公司</div>
                <div class="field content-aligned" style="top: 19.4mm;">箱入數:</div>
                <div class="field content-aligned" style="top: 24.8mm;">單品名稱:</div>

                <!-- 箱入數值 -->
                <div class="field" id="displayCount" style="top: 19.4mm;"></div>
                
                <!-- 品名容器 -->
                <div id="displayNameContainer" class="field content-aligned">
                    <span id="displayName"></span>
                </div>
                
                <!-- 底部欄位容器 -->
                <div class="field content-aligned" style="top: 48mm; display: flex; gap: 2mm; align-items: center; height: 8mm;">
                    <div id="solarDay"></div>
                    <div id="miaTag">Mia C'bon</div>
                    <div id="giftBox"><span>贈品</span></div>
                    <div id="storeBox"><span id="storeNameDisplay"></span></div>
                </div>
            </div>

            <!-- ================= 農場預覽版面 ================= -->
            <div id="farm-layout">
                <div class="farm-date" id="farmDisplayDate">11/13</div>
                <div class="farm-item-container" id="farmItemContainer">
                    <span id="farmDisplayItem">生鮮蒜仁(大仁)</span>
                </div>
                <div class="farm-bottom-row" id="farmBottomRow">
                    <span id="farmDisplayWeight">20台斤</span>
                    <span id="farmDisplayName">福利蔥蒜號</span>
                </div>
            </div>

            <!-- ================= 自用預覽版面 ================= -->
            <div id="self-layout">
                <div class="self-date" id="selfDisplayDate">11/13</div>
                <div class="self-item-container" id="selfItemContainer">
                    <span id="selfDisplayItem">特選/盒菇/日燦</span>
                </div>
            </div>

        </div>
    </div>
</div>

    // 自用資料庫
    const selfItemsDatabase = [
        "特選/盒菇/日燦",

        "子茂",
        "艸田",
        "中原",
        "素茵"
    ];

    let currentDefaultCount = null;
    let currentDefaultName = null;
    let initialTaipeiDateStr = null;

    // 取得精準台灣時間 (Asia/Taipei) 元件
    function getTaipeiTimeParts() {
        const now = new Date();
        const formatter = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Taipei',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit',
            hour12: false
        });
        const parts = {};
        formatter.formatToParts(now).forEach(({ type, value }) => {
            parts[type] = value;
        });
        const hour = parts.hour === '24' ? 0 : parseInt(parts.hour, 10);
        return {
            year: parseInt(parts.year, 10),
            month: parseInt(parts.month, 10),
            day: parseInt(parts.day, 10),
            hour: hour,
            minute: parseInt(parts.minute, 10),
            second: parseInt(parts.second, 10),
            dateStr: `${parts.year}-${parts.month}-${parts.day}`
        };
    }

    // 設定台灣時間每日 00:00 自動刷新頁面
    function setupTaiwanMidnightAutoReload() {
        const tp = getTaipeiTimeParts();
        initialTaipeiDateStr = tp.dateStr;

        // 計算距離台灣時間下一個 00:00:00 的剩餘毫秒數 (多加 500ms 緩衝確保已跨日)
        const elapsedTodayMs = ((tp.hour * 3600) + (tp.minute * 60) + tp.second) * 1000 + new Date().getMilliseconds();
        const msUntilMidnight = (24 * 60 * 60 * 1000) - elapsedTodayMs + 500;

        setTimeout(function() {
            window.location.reload();
        }, msUntilMidnight);

        // 若電腦夜間休眠、隔天喚醒頁面時，偵測台灣日期已變更也立即刷新
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') {
                const currentTp = getTaipeiTimeParts();
                if (initialTaipeiDateStr && currentTp.dateStr !== initialTaipeiDateStr) {
                    window.location.reload();
                }
            }
        });
    }

    window.onload = function() {
        // 啟動台灣時間每日 00:00 自動刷新排程
        setupTaiwanMidnightAutoReload();

        // 依台灣時間取得今天與明天日期
        const tp = getTaipeiTimeParts();
        const taipeiToday = new Date(tp.year, tp.month - 1, tp.day);
        const taipeiTomorrow = new Date(taipeiToday);
        taipeiTomorrow.setDate(taipeiToday.getDate() + 1);
        
        // 康達勝通預設明天
        const tYear = taipeiTomorrow.getFullYear();
        const tMonth = String(taipeiTomorrow.getMonth() + 1).padStart(2, '0');
        const tDay = String(taipeiTomorrow.getDate()).padStart(2, '0');
        document.getElementById('arrivalDate').value = `${tYear}-${tMonth}-${tDay}`;

        // 農場與自用預設今天
        document.getElementById('farmDate').value = tp.dateStr;
        document.getElementById('selfDate').value = tp.dateStr;

        // 初始化選單
        initFarmSelect();
        initSelfSelect();
        updateItemOptions();
        updateFarmOptions();
        switchMainCategory();
    };

    // 切換頂層大分類 (康達勝通 vs 農場 vs 自用)
    function switchMainCategory() {
        const category = document.getElementById('mainCategorySelect').value;
        const kangdaControls = document.getElementById('kangdaControls');
        const farmControls = document.getElementById('farmControls');
        const selfControls = document.getElementById('selfControls');

        const kangdaLayout = document.getElementById('kangda-layout');
        const farmLayout = document.getElementById('farm-layout');
        const selfLayout = document.getElementById('self-layout');

        kangdaControls.style.display = (category === 'kangda') ? 'block' : 'none';
        farmControls.style.display = (category === 'farm') ? 'block' : 'none';
        selfControls.style.display = (category === 'self') ? 'block' : 'none';

        kangdaLayout.style.display = (category === 'kangda') ? 'block' : 'none';
        farmLayout.style.display = (category === 'farm') ? 'flex' : 'none';
        selfLayout.style.display = (category === 'self') ? 'flex' : 'none';

        updateContent();
    }

    // ================= 康達勝通邏輯 =================
    function updateItemOptions() {
        const warehouse = document.getElementById('warehouseSelect').value;
        const itemSelect = document.getElementById('itemSelect');
        const items = itemDatabase[warehouse] || [];

        itemSelect.innerHTML = '<option value="">-- 手動輸入 --</option>';
        items.forEach(item => {
            const option = document.createElement('option');
            option.value = `${item.name},${item.count}`;
            option.textContent = item.display;
            itemSelect.appendChild(option);
        });

        document.getElementById('inputName').value = "";
        document.getElementById('inputCount').value = "";
        currentDefaultCount = null;
        currentDefaultName = null;
        updateContent();
    }

    function syncFromSelect() {
        const select = document.getElementById('itemSelect');
        const inputName = document.getElementById('inputName');
        const inputCount = document.getElementById('inputCount');

        if (select.value) {
            const [name, count] = select.value.split(',');
            inputName.value = name;
            inputCount.value = count;
            currentDefaultName = name;
            currentDefaultCount = count;
        } else {
            inputName.value = "";
            inputCount.value = "";
            currentDefaultName = null;
            currentDefaultCount = null;
        }
        updateContent();
    }

    function toggleGift(e) {
        const cb = document.getElementById('inputIsGift');
        if (e.target !== cb) {
            cb.checked = !cb.checked;
        }
        updateContent();
    }

    // ================= 農場邏輯 =================
    function initFarmSelect() {
        const farmSelect = document.getElementById('farmSelect');
        farmSelect.innerHTML = '';
        for (const [key, data] of Object.entries(farmDatabase)) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = data.label || data.name || "-- 手動輸入其他農場 --";
            farmSelect.appendChild(opt);
        }
    }

    function setWeightFieldValues(val, unit) {
        document.getElementById('inputFarmWeightVal').value = val;
        document.getElementById('inputFarmWeightUnit').value = unit;
    }

    function updateFarmOptions() {
        const farmKey = document.getElementById('farmSelect').value;
        const farmData = farmDatabase[farmKey];
        const farmItemSelect = document.getElementById('farmItemSelect');
        const inputFarmName = document.getElementById('inputFarmName');
        const inputFarmItem = document.getElementById('inputFarmItem');

        inputFarmName.value = farmData ? farmData.name : "";
        farmItemSelect.innerHTML = '<option value="">-- 手動輸入品項 --</option>';

        if (farmData && farmData.items.length > 0) {
            farmData.items.forEach((item, idx) => {
                const opt = document.createElement('option');
                opt.value = idx;
                const weightLabel = item.weightVal ? ` (${item.weightVal}${item.weightUnit})` : " (無重量)";
                opt.textContent = `${item.name}${weightLabel}`;
                farmItemSelect.appendChild(opt);
            });
            // 預設帶入第一項品名與對應重量
            farmItemSelect.value = "0";
            const firstItem = farmData.items[0];
            inputFarmItem.value = firstItem.name;
            setWeightFieldValues(firstItem.weightVal, firstItem.weightUnit);
        } else {
            inputFarmItem.value = "";
            setWeightFieldValues("", "台斤");
        }
        updateContent();
    }

    function syncFarmItem() {
        const farmKey = document.getElementById('farmSelect').value;
        const farmData = farmDatabase[farmKey];
        const idx = document.getElementById('farmItemSelect').value;
        const inputFarmItem = document.getElementById('inputFarmItem');

        if (idx !== "" && farmData && farmData.items[idx]) {
            const selectedItem = farmData.items[idx];
            inputFarmItem.value = selectedItem.name;
            setWeightFieldValues(selectedItem.weightVal, selectedItem.weightUnit);
        } else {
            inputFarmItem.value = "";
            setWeightFieldValues("", "台斤");
        }
        updateContent();
    }

    // ================= 自用邏輯 =================
    function initSelfSelect() {
        const selfItemSelect = document.getElementById('selfItemSelect');
        selfItemSelect.innerHTML = '<option value="">-- 手動輸入文字 --</option>';
        selfItemsDatabase.forEach(item => {
            const opt = document.createElement('option');
            opt.value = item;
            opt.textContent = item;
            selfItemSelect.appendChild(opt);
        });
        // 預設選取第一項
        if (selfItemsDatabase.length > 0) {
            selfItemSelect.value = selfItemsDatabase[0];
            document.getElementById('inputSelfItem').value = selfItemsDatabase[0];
        }
    }

    function syncSelfItem() {
        const val = document.getElementById('selfItemSelect').value;
        document.getElementById('inputSelfItem').value = val;
        updateContent();
    }

    // ================= 畫面更新總控 =================
    function updateContent() {
        const category = document.getElementById('mainCategorySelect').value;
        const weekDays = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];

        if (category === 'kangda') {
            const warehouse = document.getElementById('warehouseSelect').value;
            const nameInput = document.getElementById('inputName').value;
            const countInputVal = document.getElementById('inputCount').value;
            const dateVal = document.getElementById('arrivalDate').value;
            const isGift = document.getElementById('inputIsGift').checked;
            const storeNameVal = document.getElementById('inputStoreName').value.trim();
            
            const nameSpan = document.getElementById('displayName');
            const nameContainer = document.getElementById('displayNameContainer');
            const solarDayDiv = document.getElementById('solarDay');
            const panelHint = document.getElementById('panelDateHint');
            const miaTag = document.getElementById('miaTag');
            const giftBox = document.getElementById('giftBox');
            const storeBox = document.getElementById('storeBox');
            const storeNameDisplay = document.getElementById('storeNameDisplay');
            
            // 樣式檢測 (是否修改過預設值)
            const nameInputEl = document.getElementById('inputName');
            if (currentDefaultName !== null && nameInput !== currentDefaultName) {
                nameInputEl.classList.add('is-modified');
            } else {
                nameInputEl.classList.remove('is-modified');
            }

            const countInputEl = document.getElementById('inputCount');
            if (currentDefaultCount !== null && countInputVal !== currentDefaultCount) {
                countInputEl.classList.add('is-modified');
            } else {
                countInputEl.classList.remove('is-modified');
            }

            // 太陽日計算
            if (dateVal) {
                const parts = dateVal.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                panelHint.innerText = `${y}/${m}/${day} (${weekDays[d.getDay()]})`;
                solarDayDiv.innerText = calculateSolarDay(d);
                solarDayDiv.style.visibility = 'visible';
            } else {
                panelHint.innerText = "";
                solarDayDiv.innerText = "";
                solarDayDiv.style.visibility = 'hidden';
            }

            // 底部元件動態顯示
            miaTag.style.display = (warehouse === 'mia') ? 'flex' : 'none';
            giftBox.style.display = isGift ? 'flex' : 'none';

            if (storeNameVal) {
                storeNameDisplay.innerText = storeNameVal;
                storeBox.style.display = 'flex';
            } else {
                storeBox.style.display = 'none';
            }

            // 品名自動縮放與置中
            nameSpan.innerText = nameInput || "";
            nameSpan.style.fontSize = "24pt"; 
            const maxWidth = nameContainer.offsetWidth;
            let currentFontSize = 24;
            while (nameSpan.offsetWidth > maxWidth && currentFontSize > 6) {
                currentFontSize -= 0.5;
                nameSpan.style.fontSize = currentFontSize + "pt";
            }
            
            document.getElementById('displayCount').innerText = countInputVal ? countInputVal + " 入" : "";

        } else if (category === 'farm') {
            // 農場模式畫面更新
            const farmName = document.getElementById('inputFarmName').value.trim();
            const farmItem = document.getElementById('inputFarmItem').value;
            const farmWeightVal = document.getElementById('inputFarmWeightVal').value.trim();
            const farmWeightUnit = document.getElementById('inputFarmWeightUnit').value;
            const farmDateVal = document.getElementById('farmDate').value;

            const farmDisplayDate = document.getElementById('farmDisplayDate');
            const farmDateHint = document.getElementById('farmDateHint');
            const farmDisplayItem = document.getElementById('farmDisplayItem');
            const farmItemContainer = document.getElementById('farmItemContainer');
            const farmDisplayWeight = document.getElementById('farmDisplayWeight');
            const farmDisplayName = document.getElementById('farmDisplayName');
            const farmBottomRow = document.getElementById('farmBottomRow');

            // 日期格式化 (MM/DD)
            if (farmDateVal) {
                const parts = farmDateVal.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                farmDateHint.innerText = `${y}/${m}/${day} (${weekDays[d.getDay()]})`;
                farmDisplayDate.innerText = `${m}/${day}`;
            } else {
                farmDateHint.innerText = "";
                farmDisplayDate.innerText = "";
            }

            // 品項名稱基準 36pt，超過 12mm 安全邊界自動縮小
            farmDisplayItem.innerText = farmItem || "";
            farmDisplayItem.style.fontSize = "36pt";
            const maxFarmWidth = farmItemContainer.offsetWidth;
            let farmFontSize = 36;
            while (farmDisplayItem.offsetWidth > maxFarmWidth && farmFontSize > 6) {
                farmFontSize -= 0.5;
                farmDisplayItem.style.fontSize = farmFontSize + "pt";
            }

            // 重量 22pt、農場名稱 17pt (超過 12mm 安全邊界時維持比例縮小)
            farmDisplayWeight.innerText = farmWeightVal ? `${farmWeightVal}${farmWeightUnit}` : "";
            farmDisplayName.innerText = farmName || "";

            let weightFontSize = 22;
            let nameFontSize = 17;
            farmDisplayWeight.style.fontSize = weightFontSize + "pt";
            farmDisplayName.style.fontSize = nameFontSize + "pt";

            while (farmBottomRow.scrollWidth > farmBottomRow.offsetWidth && nameFontSize > 6) {
                weightFontSize -= 0.5;
                nameFontSize -= 0.5;
                farmDisplayWeight.style.fontSize = weightFontSize + "pt";
                farmDisplayName.style.fontSize = nameFontSize + "pt";
            }

        } else {
            // 自用模式畫面更新
            const selfItem = document.getElementById('inputSelfItem').value;
            const selfDateVal = document.getElementById('selfDate').value;

            const selfDisplayDate = document.getElementById('selfDisplayDate');
            const selfDateHint = document.getElementById('selfDateHint');
            const selfDisplayItem = document.getElementById('selfDisplayItem');
            const selfItemContainer = document.getElementById('selfItemContainer');

            // 日期格式化 (MM/DD)
            if (selfDateVal) {
                const parts = selfDateVal.split('-');
                const d = new Date(parts[0], parts[1] - 1, parts[2]);
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                selfDateHint.innerText = `${y}/${m}/${day} (${weekDays[d.getDay()]})`;
                selfDisplayDate.innerText = `${m}/${day}`;
            } else {
                selfDateHint.innerText = "";
                selfDisplayDate.innerText = "";
            }

            // 中間大字基準 36pt，超過左右 12mm 安全邊界自動縮小
            selfDisplayItem.innerText = selfItem || "";
            selfDisplayItem.style.fontSize = "36pt";
            const maxSelfWidth = selfItemContainer.offsetWidth;
            let selfFontSize = 36;
            while (selfDisplayItem.offsetWidth > maxSelfWidth && selfFontSize > 6) {
                selfFontSize -= 0.5;
                selfDisplayItem.style.fontSize = selfFontSize + "pt";
            }
        }
    }

    function calculateSolarDay(date) {
        const year = date.getFullYear();
        const firstDayOfYear = new Date(year, 0, 1);
        const diff = Math.floor((date - firstDayOfYear) / (1000 * 60 * 60 * 24)) + 1;
        return String(diff).padStart(3, '0');
    }
